groups:
  - name: phishing-triage
    interval: 30s
    rules:
      - alert: QueueDepthHigh
        expr: raw_queue_depth > 1000 or triage_queue_depth > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline backing up"
          description: "One of the Redis queues has exceeded 1000 entries for 5+ minutes. The filter or LLM tier is not keeping up with ingest."

      - alert: LLMErrorRateHigh
        # non-ok responses divided by all requests, over 2m window
        expr: |
          sum(rate(llm_requests_total{status!="ok"}[2m]))
          / sum(rate(llm_requests_total[2m])) > 0.20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LLM error rate above 20%"
          description: "More than 1 in 5 Groq calls is failing (429/5xx/timeout/transport)."

      - alert: AllBreakersOpen
        # breaker_state == 2 means open. If every worker is open, we are fully
        # on the fallback classifier and the dashboard loses LLM reasoning.
        expr: min(breaker_state) == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "All llm-worker breakers are open"
          description: "The pipeline is 100% on the rule-based fallback. Groq is unreachable or has been failing hard."

      - alert: IngestionStalled
        expr: time() - ingester_last_event_timestamp > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "No certs ingested in 2+ minutes"
          description: "The Certstream WebSocket may be disconnected or the upstream is quiet."
