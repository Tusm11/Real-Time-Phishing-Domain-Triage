global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingester
    static_configs:
      - targets: ["ingester:9101"]

  - job_name: filter
    static_configs:
      - targets: ["filter:9102"]

  - job_name: llm-workers
    static_configs:
      - targets:
          - "llm-worker-1:9103"
          - "llm-worker-2:9103"
          - "llm-worker-3:9103"
        labels:
          tier: llm

  - job_name: api
    static_configs:
      - targets: ["api:9104"]
    # The API service may be absent during Weekend 1 — Prometheus will log
    # scrape failures until it comes up. Harmless.

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
