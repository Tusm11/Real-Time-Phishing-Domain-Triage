# HAProxy fronting the 3 llm-worker replicas.
# TCP mode: workers accept HTTP but we don't need L7 features here —
# round-robin + health check on /health is enough.

global
    log stdout format raw local0 info
    maxconn 4096
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

# ---------------------------------------------------------------------------
# Stats UI — exposed on :8081 for the demo.
# "docker kill phish-llm-worker-2" during the demo and watch it drop out here.
# ---------------------------------------------------------------------------
frontend stats
    bind *:8081
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats admin if TRUE

# ---------------------------------------------------------------------------
# LLM-worker pool — frontend on :8080.
# Nothing currently calls HAProxy directly (workers pull from Redis), but the
# tier is wired so an external caller — a k6 synthetic load, a future API
# health endpoint, or a manual curl — can hit a worker without caring which.
# ---------------------------------------------------------------------------
frontend llm_front
    bind *:8080
    default_backend llm_pool

backend llm_pool
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 5s fall 3 rise 2
    server w1 llm-worker-1:8000 check
    server w2 llm-worker-2:8000 check
    server w3 llm-worker-3:8000 check
